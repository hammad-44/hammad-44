
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10151F"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="80" x2="850" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83B9FF"/>
      <stop offset=".52" stop-color="#4788FF"/>
      <stop offset="1" stop-color="#B5A1FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9BB5D9" stroke-opacity=".075"/>
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#397DFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#397DFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="940" cy="160" rx="330" ry="260" fill="url(#glow)"/>

    <g opacity=".9">
      <circle cx="930" cy="175" r="116" stroke="#7BA9FF" stroke-opacity=".18"/>
      <circle cx="930" cy="175" r="84" stroke="#7BA9FF" stroke-opacity=".28" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0 930 175" to="360 930 175" dur="65s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="930" cy="175" rx="160" ry="60" transform="rotate(-32 930 175)" stroke="url(#accent)" stroke-opacity=".55"/>
      <ellipse cx="930" cy="175" rx="160" ry="60" transform="rotate(42 930 175)" stroke="#83B9FF" stroke-opacity=".28"/>
      <circle cx="1059" cy="93" r="5" fill="#83B9FF">
        <animate attributeName="opacity" values=".45;1;.45" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="211" r="4" fill="#B5A1FF">
        <animate attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="965" cy="287" r="3" fill="#83B9FF"/>
    </g>

    <path d="M0 309H1200" stroke="#FFFFFF" stroke-opacity=".10"/>
    <path d="M52 309H200" stroke="url(#accent)" stroke-width="2"/>

    <text x="62" y="61" fill="#9DB5D6" font-family="monospace" font-size="12" letter-spacing="3">INDEPENDENT THINKING / PRACTICAL ENGINEERING</text>

    <text x="58" y="147" fill="#F4F7FC" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2">HAMMAD</text>
    <text x="58" y="208" fill="#F4F7FC" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2">HAIDER<tspan fill="url(#accent)">.</tspan></text>

    <text x="62" y="246" fill="#AAB8CC" font-family="monospace" font-size="15">FULL STACK DEVELOPER  /  AI BUILDER</text>

    <rect x="62" y="270" width="8" height="8" rx="2" fill="#72A7FF">
      <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="279" fill="#D5DFEF" font-family="monospace" font-size="12">PYTHON · REACT · MACHINE LEARNING</text>

    <text x="62" y="337" fill="#73839A" font-family="monospace" font-size="10" letter-spacing="2">BUILD WITH INTENTION.</text>
    <text x="1138" y="337" text-anchor="end" fill="#73839A" font-family="monospace" font-size="10">PAKISTAN / PK</text>
  </g>
</svg>
